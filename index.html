<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INOVALUM CRM</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f5f9;margin:0;text-align:center}
header{background:#142b43;color:white;padding:30px 15px}
main{padding:25px 15px;max-width:450px;margin:auto}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
button{background:#087c83;color:white;border:0;padding:14px;border-radius:8px;width:100%;font-size:16px}
</style>
</head>
<body>
  <div class="card" id="login">
  <h2>Iniciar sesión</h2>
  <input id="correo" type="email" placeholder="Correo electrónico">
  <input id="contrasena" type="password" placeholder="Contraseña">
  <button onclick="iniciarSesion()">Entrar</button>
  <p id="mensajeLogin"></p>
</div>
<header><h1>INOVALUM CRM</h1><p>Aluminio y Cristal</p></header>
<main>
<h2>Panel principal</h2>

<div class="card">
  <h3>Clientes</h3>
  <button onclick="mostrarClientes()">
    Registrar cliente
  </button>
</div>

<div id="clientes" class="card" style="display:none">
  <h3>Nuevo cliente</h3>
  <input id="nombre" placeholder="Nombre del cliente">
  <input id="telefono" placeholder="Teléfono">
  <input id="direccion" placeholder="Dirección">
  <button onclick="guardarCliente()">Guardar cliente</button>
  <p id="mensaje"></p>
</div>

<div class="card"><h3>Cotizaciones</h3><button disabled>Próximamente</button></div>
<div class="card"><h3>Instalaciones</h3><button disabled>Próximamente</button></div>
<div class="card"><h3>Pagos</h3><button disabled>Próximamente</button></div>
</main>
<script> 
  const SUPABASE_URL = "https://bzoiyrxrleihasnmfbwb.supabase.co/";
const SUPABASE_KEY = "sb_publishable_xw1K4xmNH0MImEj4cG4LBw__2bdHBno";
function mostrarClientes() {
  document.getElementById("clientes").style.display = "block";
}

async function guardarCliente() {
  const nombre = document.getElementById("nombre").value.trim();
  const telefono = document.getElementById("telefono").value.trim();
  const direccion = document.getElementById("direccion").value.trim();
  const mensaje = document.getElementById("mensaje");

  if (!nombre || !telefono) {
    mensaje.textContent = "Escribe nombre y teléfono.";
    return;
  }

  const token = localStorage.getItem("supabase_token");

  if (!token) {
    mensaje.textContent = "Primero debemos configurar el inicio de sesión.";
    return;
  }

  try {
    const respuesta = await fetch(
      SUPABASE_URL + "/rest/v1/clientes",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          nombre: nombre,
          telefono: telefono,
          direccion: direccion,
          usuario_id: JSON.parse(atob(token.split(".")[1])).sub
        })
      }
    );

    if (!respuesta.ok) {
    const detalle = await respuesta.text();
throw new Error(detalle);
    }

    mensaje.textContent = "Cliente guardado correctamente.";
  } catch (error) {
    mensaje.textContent = error.message;
  }
}

async function iniciarSesion() {
  const correo = document.getElementById("correo").value.trim();
  const contrasena = document.getElementById("contrasena").value;
  const mensaje = document.getElementById("mensajeLogin");

  mensaje.textContent = "Iniciando sesión...";

  try {
    const respuesta = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: correo,
          password: contrasena
        })
      }
    );

    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(datos.msg || datos.error_description || datos.message || "No se pudo iniciar sesión");
    }

    localStorage.setItem("supabase_token", datos.access_token);
    mensaje.textContent = "Sesión iniciada correctamente.";
  } catch (error) {
    mensaje.textContent = error.message;
  }
}

</script>
</body>
</html>
